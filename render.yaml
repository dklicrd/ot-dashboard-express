# Render Blueprint — Deploy OT Dashboard Express
# Conecta tu repositorio a Render y automáticamente crea el servicio.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ot-dashboard
    env: node
    region: ohio
    plan: free # ⚠️ CAMBIAR a 'starter' para activar disco persistente y NO perder datos
    # Cuando cambies al plan Starter ($7/mes), Render usara automaticamente el disco:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    buildCommand: npm install --no-optional
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: ot-dashboard-secret-fijo-2026-dklic-plus
        # ⚠️ No usar generateValue: true porque cada deploy regenera el secret
        # e invalida todos los tokens existentes. Usar valor fijo.
      - key: DASHBOARD_URL
        value: https://ot-dashboard-9mn9.onrender.com
      # ⚠️ Free tier de Render NO tiene disco persistente.
      # Los datos en SQLite se pierden con cada deploy.
      # Para persistencia: actualizar a plan Starter ($7/mes)
      # o migrar a PostgreSQL externo.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      # SMTP_USER y SMTP_PASS deben configurarse manualmente en Render Dashboard
      # usando una contraseña de aplicación de Google (no la contraseña normal)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: notificaciones@dklicplus.com
      # ⚠️ DB_PATH: en Render se puede usar un disco persistente.
      # Si usas plan Starter+, descomenta disk: arriba y setea:
      # - key: DB_PATH
      #   value: /var/data/ot-dashboard.db
