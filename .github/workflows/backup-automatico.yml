name: 🤖 Backup Automático
on:
  schedule:
    # Cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # También se puede ejecutar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Descargar backup desde Render
        run: |
          # Obtener token de autenticación
          TOKEN=$(curl -s -X POST "${{ vars.DASHBOARD_URL }}/api/auth" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@sistema.com","password":"${{ secrets.ADMIN_PASSWORD }}"}' | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "❌ No se pudo autenticar"
            exit 1
          fi
          
          # Forzar exportación y descargar
          curl -s -X POST "${{ vars.DASHBOARD_URL }}/api/exportar-backup" \
            -H "Authorization: Bearer $TOKEN"
          
          curl -s -X GET "${{ vars.DASHBOARD_URL }}/api/exportar-backup" \
            -H "Authorization: Bearer $TOKEN" -o data/backup.json
          
          echo "✅ Backup descargado"
      
      - name: Verificar y hacer commit
        run: |
          if git diff --quiet data/backup.json; then
            echo "📭 Backup sin cambios"
          else
            git config user.name "GitHub Backup Bot"
            git config user.email "bot@dklicrd.com"
            git add data/backup.json
            git commit -m "🤖 backup automático $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Backup actualizado y pusheado"
          fi
