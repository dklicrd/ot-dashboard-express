name: Backup Database

on:
  schedule:
    # Cada hora en horario laboral (8am-6pm AST, L-V)
    - cron: '0 * * * 1-5'
  workflow_dispatch: # Manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backup webhook
        run: |
          curl -X POST "${{ secrets.RENDER_BACKUP_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"backup": true}'
