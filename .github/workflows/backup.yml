name: Export Backup from Render

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del backup manual'
        required: false
        default: 'manual'

jobs:
  export-backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Request backup from Render
        id: fetch-backup
        run: |
          echo "⏳ Solicitando backup desde Render..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET "https://ot-dashboard-9mn9.onrender.com/api/export-backup/download" \
            -H "X-Backup-Token: ${{ secrets.BACKUP_TOKEN }}" \
            --max-time 60)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "$BODY" > data/backup.json
            echo "✅ Backup descargado (HTTP $HTTP_CODE)"
            echo "backup_size=$(wc -c < data/backup.json)" >> $GITHUB_OUTPUT
            echo "backup_changed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Error al obtener backup (HTTP $HTTP_CODE): $BODY"
            echo "backup_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit backup changes
        if: steps.fetch-backup.outputs.backup_changed == 'true'
        run: |
          git config user.name "dklicrd"
          git config user.email "dklicrd@gmail.com"

          if git diff --quiet data/backup.json; then
            echo "ℹ️ Backup sin cambios — no se necesita commit"
          else
            git add data/backup.json
            git commit -m "🤖 backup automático $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ Backup commiteado y pusheado"
          fi

      - name: Summary
        run: |
          echo "## Backup Results" >> $GITHUB_STEP_SUMMARY
          echo "- Backup size: ${{ steps.fetch-backup.outputs.backup_size || 'N/A' }} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- Source: https://ot-dashboard-9mn9.onrender.com" >> $GITHUB_STEP_SUMMARY
