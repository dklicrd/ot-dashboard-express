name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "🚀 Triggering deploy on Render..."
          # Intentar login y luego forzar deploy via API interna
          # Primero check si la app responde
          echo "📡 Checking current Render version..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://ot-dashboard-9mn9.onrender.com/" --max-time 15 || echo "000")
          echo "Status: $STATUS"

          # También podemos notificar al usuario que haga deploy manual
          echo "✅ Notificado: se requiere deploy manual en Render Dashboard"
          echo ""
          echo "👉 Ve a: https://dashboard.render.com/web/srv-cq9agft6l47c73c2qaag"
          echo "👉 Click: Manual Deploy → Deploy latest commit"