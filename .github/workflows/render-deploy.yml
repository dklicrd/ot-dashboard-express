name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render Deploy via Webhook
        run: |
          echo "✅ Push a master detectado"
          # El webhook de Render se activa automáticamente cuando hay push a master
          # Si no está configurado, se necesita deploy manual
          echo "👉 Render debería detectar el push automáticamente"
          echo "👉 Si no, haz deploy manual en:"
          echo "   https://dashboard.render.com/"