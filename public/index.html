<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>OT Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .sidebar { width: 260px; min-width: 260px; }
  .sidebar-header { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
  .sidebar-item { @apply flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium transition-all duration-150 cursor-pointer relative; }
  .sidebar-item.active { @apply bg-blue-600 text-white; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }
  .sidebar-item:not(.active) { @apply text-gray-300 hover:bg-gray-800 hover:text-white; }
  .sidebar-item-icon { @apply inline-flex items-center justify-center w-5 shrink-0 text-sm transition-all duration-150; }
  .sidebar-item-text { @apply truncate font-medium; }
  .sidebar-item-badge { @apply ml-auto text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full; }
  .sidebar-divider { @apply border-t border-gray-700/50 mx-3 my-2; }
  .sidebar-footer-text { @apply text-[10px] text-gray-600 px-3 pb-1 select-none; }
  .scrollbar-thin::-webkit-scrollbar { width: 3px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
  .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
  .sidebar-item::after {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    border-radius: 0 3px 3px 0;
    transition: height 0.2s ease;
  }
  .sidebar-item.active::after {
    height: 60%;
    background: #60a5fa;
  }
  .sidebar-item:not(.active):hover::after {
    height: 40%;
    background: rgba(255,255,255,0.08);
  }
  .btn-primary { @apply bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-2.5 px-5 rounded-xl transition-all duration-150 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed; }
  .btn-secondary { @apply bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 font-semibold py-2.5 px-5 rounded-xl transition-all duration-150 border border-gray-300 hover:border-gray-400 shadow-sm; }
  .btn-danger { @apply bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-semibold py-2.5 px-5 rounded-xl transition-all duration-150 shadow-md hover:shadow-lg; }
  .btn-success { @apply bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-semibold py-2.5 px-5 rounded-xl transition-all duration-150 shadow-md hover:shadow-lg; }
  .card { @apply bg-white rounded-xl shadow-md border border-gray-200 p-6 hover:shadow-lg transition-shadow duration-200; }
  .card-header { @apply text-lg font-semibold text-gray-900 mb-4 pb-3 border-b border-gray-100; }
  .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
  .badge-pendiente { @apply badge bg-yellow-100 text-yellow-800; }
  .badge-aprobada { @apply badge bg-green-100 text-green-800; }
  .badge-en_curso { @apply badge bg-blue-100 text-blue-800; }
  .badge-completada { @apply badge bg-gray-100 text-gray-800; }
  .badge-cancelada { @apply badge bg-red-100 text-red-800; }
  .modal-overlay { @apply fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4; }
  .modal-content { @apply bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-gray-100; }
  .toast { @apply fixed bottom-6 right-6 z-[100] px-6 py-3 rounded-lg shadow-lg text-white text-sm font-medium transition-all duration-300; }
  .loading-spinner { @apply inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.2s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .slide-up { animation: slideUp 0.3s ease-out; }
  .star-rating button { transition: all 0.15s ease; }
  .star-rating button:hover { transform: scale(1.15); }
  .scrollbar-thin::-webkit-scrollbar { width: 4px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  .input-field { @apply w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-150 bg-white; }
  .select-field { @apply w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-150 bg-white; }
  .btn-icon { @apply inline-flex items-center justify-center w-9 h-9 rounded-lg transition-all duration-150 shadow-sm; }
  .btn-edit { @apply btn-icon bg-amber-50 hover:bg-amber-100 text-amber-600 hover:text-amber-700 border border-amber-200; }
  .btn-delete { @apply btn-icon bg-red-50 hover:bg-red-100 text-red-600 hover:text-red-700 border border-red-200; }
</style>
</head>
<body class="bg-gray-50 text-gray-800">

<div id="app">
  <div class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="loading-spinner border-blue-600 border-4 w-10 h-10 mx-auto mb-4"></div>
      <p class="text-gray-500">Cargando...</p>
    </div>
  </div>
</div>

<script>
// ============ STATE ============
const state = {
  token: localStorage.getItem('token') || null,
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  view: 'login',
  _toastTimer: null,
};

function setState(partial) {
  Object.assign(state, partial);
  render();
}

function toast(message, type = 'success') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (state._toastTimer) clearTimeout(state._toastTimer);

  const bg = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
  const el = document.createElement('div');
  el.className = `toast slide-up ${bg}`;
  el.textContent = message;
  document.body.appendChild(el);
  state._toastTimer = setTimeout(() => { el.remove(); }, 3500);
}

// ============ API HELPER ============
async function api(method, path, body) {
  const opts = { method, headers: { Authorization: `Bearer ${state.token}` } };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

// ============ LOGIN ============
function renderLogin() {
  return `
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-blue-900">
      <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
        <div class="text-center mb-8">
          <div class="text-5xl mb-4">🔐</div>
          <h1 class="text-3xl font-bold text-gray-900">OT Dashboard</h1>
          <p class="text-gray-500 mt-2">Gestión de Órdenes de Trabajo</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div id="login-error" class="hidden bg-red-50 text-red-700 px-4 py-3 rounded-lg text-sm border border-red-200"></div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input type="email" id="login-email" class="input-field" placeholder="admin@sistema.com" required autocomplete="email">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="login-pass" class="input-field" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn-primary w-full py-3 text-lg" id="login-btn">Iniciar Sesión</button>
        </form>
        <div class="mt-6 p-4 bg-gray-50 rounded-lg text-xs text-gray-500 text-center">
          <strong>🔑 Acceso de prueba:</strong><br>
          Admin: <code>admin@sistema.com</code> / <code>admin123</code><br>
          Técnico: <code>maximo@sistema.com</code> / <code>tecnico123</code>
        </div>
      </div>
    </div>
  `;
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const errDiv = document.getElementById('login-error');

  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Iniciando...';
  errDiv.classList.add('hidden');

  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    setState({ token: data.token, user: data.user, view: 'inicio' });
    toast('Sesión iniciada correctamente');
  } catch (err) {
    errDiv.textContent = err.message;
    errDiv.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Iniciar Sesión';
  }
}

// ============ LAYOUT ============
const navItems = {
  admin: [
    { id: 'inicio', label: 'Inicio', icon: '📊' },
    { id: 'ordenes', label: 'Órdenes de Trabajo', icon: '📋' },
    { id: 'avales', label: 'Avales', icon: '✅' },
    { id: 'encuestas', label: 'Encuestas', icon: '⭐' },
    { id: 'reportes', label: 'Reportes', icon: '📈' },
    { id: 'bonos', label: 'Bonos', icon: '💰' },
    { id: 'productos', label: 'Productos', icon: '📦' },
    { id: 'usuarios', label: 'Usuarios', icon: '👥' },
    { id: 'config', label: 'Configuración', icon: '⚙️' },
  ],
  tecnico: [
    { id: 'inicio', label: 'Inicio', icon: '📊' },
    { id: 'ordenes', label: 'Mis Órdenes', icon: '📋' },
    { id: 'avales', label: 'Mis Avales', icon: '✅' },
  ],
  servicio_cliente: [
    { id: 'inicio', label: 'Inicio', icon: '📊' },
    { id: 'encuestas', label: 'Encuestas', icon: '⭐' },
    { id: 'reportes', label: 'Reportes', icon: '📈' },
  ],
};

function renderLayout() {
  const items = navItems[state.user?.rol] || navItems.admin;
  const rolLabel = { admin: 'Administrador', tecnico: 'Técnico', servicio_cliente: 'Servicio al Cliente' }[state.user?.rol] || '';

  return `
    <div class="min-h-screen flex">
      <!-- Sidebar -->
      <aside class="sticky top-0 h-screen w-[260px] bg-gray-900 text-white shadow-2xl shadow-black/30 flex-shrink-0" id="sidebar" style="min-height:100vh">
        <div class="h-full flex flex-col">
          <!-- Header premium -->
          <div class="sidebar-header px-4 pt-4 pb-3">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 bg-white/15 backdrop-blur-sm rounded-lg flex items-center justify-center shrink-0 border border-white/10"><span class="text-base">🔧</span></div>
              <div>
                <div class="flex items-baseline gap-2">
                  <span class="text-sm font-bold text-white">OT Dashboard</span>
                  <span class="text-[10px] text-blue-200/80 capitalize font-medium">${rolLabel}</span>
                </div>
              </div>
            </div>
          </div>
          <!-- Usuario en línea horizontal -->
          <div class="px-3 py-2 bg-gray-900 border-b border-gray-800 flex items-center gap-1.5">
            <span class="w-5 h-5 rounded-full bg-blue-600 inline-flex items-center justify-center text-[8px] font-bold text-white shrink-0">${(state.user?.nombre || '?')[0].toUpperCase()}</span>
            <span class="text-[11px] font-medium text-gray-300 truncate">${state.user?.nombre}</span>
          </div>
          <!-- Navegación principal -->
          <div class="flex-1 overflow-y-auto scrollbar-thin py-2 px-2.5 space-y-0.5">
            ${items.map((i, idx) => `
              <a href="#" onclick="setState({view:'${i.id}'});closeSidebar()" class="sidebar-item group ${state.view === i.id ? 'active' : ''}">
                <span class="sidebar-item-icon">${i.icon}</span>
                <span>${i.label}</span>
                ${i.badge ? `<span class="sidebar-item-badge">${i.badge}</span>` : ''}
              </a>
            `).join('')}
          </div>
          <!-- Footer -->
          <div class="border-t border-gray-800/80 bg-gray-900/50 px-2.5 py-2 space-y-0.5">
            <a href="#" onclick="setState({view:'perfil'});closeSidebar()" class="sidebar-item group ${state.view === 'perfil' ? 'active' : ''}">
              <span class="sidebar-item-icon">👤</span>
              <span>Perfil</span>
            </a>
            <a href="#" onclick="handleLogout()" class="sidebar-item group hover:!bg-red-900/20 hover:!text-red-300">
              <span class="sidebar-item-icon group-hover:text-red-300">🚪</span>
              <span class="group-hover:text-red-300">Cerrar Sesión</span>
            </a>
          </div>
        </div>
      </aside>
      <div class="hidden" id="sidebar-overlay"></div>

      <!-- Main -->
      <div class="flex-1 min-w-0">
        <header class="bg-white shadow-sm border-b border-gray-200 hidden px-4 py-3 flex items-center justify-between sticky top-0 z-30">
          <button onclick="toggleSidebar()" class="text-gray-600 text-2xl p-1">☰</button>
          <h2 class="text-lg font-semibold">OT Dashboard</h2>
          <div class="w-8"></div>
        </header>
        <main class="p-4 lg:p-8" id="main-content">
          <div class="flex items-center justify-center py-20">
            <div class="loading-spinner border-blue-600 border-4 w-8 h-8"></div>
          </div>
        </main>
      </div>
    </div>
  `;
}

function toggleSidebar() { /* sidebar always visible */ }
function closeSidebar() { /* sidebar always visible */ }

function handleLogout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  setState({ token: null, user: null, view: 'login' });
  toast('Sesión cerrada');
}

// ============ INICIO ============
async function renderInicio() {
  let total = 0, pend = 0, curso = 0, comp = 0;
  try {
    const d = await api('GET', '/api/ordenes');
    total = d.ordenes?.length || 0;
    pend = d.ordenes?.filter(o => o.estado === 'pendiente').length || 0;
    curso = d.ordenes?.filter(o => o.estado === 'en_curso').length || 0;
    comp = d.ordenes?.filter(o => o.estado === 'completada').length || 0;
  } catch (e) { /* ignore */ }
  const tasa = total ? Math.round((comp / total) * 100) : 0;

  return `
    <div class="fade-in">
      <h1 class="text-2xl font-bold text-gray-900 mb-1">Bienvenido, ${state.user?.nombre}</h1>
      <p class="text-gray-500 mb-8">Panel de control · ${new Date().toLocaleDateString('es-DO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="card slide-up" style="animation-delay:0s"><div class="flex items-start justify-between"><div><p class="text-sm text-gray-500 font-medium">Total Órdenes</p><p class="text-3xl font-bold text-gray-900 mt-1">${total}</p><p class="text-xs text-gray-400 mt-1"><span class="text-yellow-600 font-medium">${pend}</span> pendientes</p></div><div class="bg-blue-50 p-3 rounded-lg"><span class="text-2xl">📋</span></div></div></div>
        <div class="card slide-up" style="animation-delay:0.1s"><div class="flex items-start justify-between"><div><p class="text-sm text-gray-500 font-medium">Completadas</p><p class="text-3xl font-bold text-gray-900 mt-1">${comp}</p><p class="text-xs text-gray-400 mt-1">Últimos 100 registros</p></div><div class="bg-green-50 p-3 rounded-lg"><span class="text-2xl">✅</span></div></div></div>
        <div class="card slide-up" style="animation-delay:0.2s"><div class="flex items-start justify-between"><div><p class="text-sm text-gray-500 font-medium">En Curso</p><p class="text-3xl font-bold text-gray-900 mt-1">${curso}</p><p class="text-xs text-gray-400 mt-1">Activas ahora</p></div><div class="bg-yellow-50 p-3 rounded-lg"><span class="text-2xl">🔧</span></div></div></div>
        <div class="card slide-up" style="animation-delay:0.3s"><div class="flex items-start justify-between"><div><p class="text-sm text-gray-500 font-medium">Tasa de Finalización</p><p class="text-3xl font-bold text-gray-900 mt-1">${tasa}%</p><p class="text-xs text-gray-400 mt-1">${pend} pendientes por resolver</p></div><div class="bg-purple-50 p-3 rounded-lg"><span class="text-2xl">📊</span></div></div></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card">
          <h3 class="card-header">Acciones Rápidas</h3>
          <div class="space-y-3">
            <a href="#" onclick="setState({view:'ordenes'})" class="flex items-center gap-4 p-4 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors group">
              <span class="text-2xl group-hover:scale-110 transition-transform">📋</span>
              <div><p class="font-medium text-blue-800">Nueva Orden de Trabajo</p><p class="text-sm text-blue-600">Crear OT desde presupuesto aprobado</p></div>
            </a>
            <a href="#" onclick="setState({view:'avales'})" class="flex items-center gap-4 p-4 bg-green-50 rounded-lg hover:bg-green-100 transition-colors group">
              <span class="text-2xl group-hover:scale-110 transition-transform">✅</span>
              <div><p class="font-medium text-green-800">Generar Aval de Servicio</p><p class="text-sm text-green-600">Crear y enviar aval al técnico</p></div>
            </a>
            <a href="#" onclick="setState({view:'encuestas'})" class="flex items-center gap-4 p-4 bg-purple-50 rounded-lg hover:bg-purple-100 transition-colors group">
              <span class="text-2xl group-hover:scale-110 transition-transform">⭐</span>
              <div><p class="font-medium text-purple-800">Registrar Encuesta</p><p class="text-sm text-purple-600">Completar encuesta de satisfacción</p></div>
            </a>
          </div>
        </div>
        <div class="card">
          <h3 class="card-header">Estado del Sistema</h3>
          ${barraProgreso('Órdenes Pendientes', pend, total || 1, 'bg-yellow-500')}
          ${barraProgreso('Órdenes en Curso', curso, total || 1, 'bg-blue-500')}
          ${barraProgreso('Completadas', comp, total || 1, 'bg-green-500')}
          <div class="mt-6 pt-4 border-t border-gray-100">
            <p class="text-sm text-gray-500 text-center">Total: <strong>${total}</strong> órdenes registradas</p>
          </div>
        </div>
      </div>
    </div>
  `;
}

function barraProgreso(label, val, total, color) {
  const pct = Math.round((val / total) * 100);
  return `<div class="mb-4"><div class="flex justify-between text-sm mb-1"><span class="text-gray-600">${label}</span><span class="font-semibold">${val}</span></div><div class="w-full bg-gray-200 rounded-full h-2.5"><div class="${color} h-2.5 rounded-full transition-all duration-500" style="width:${pct}%"></div></div></div>`;
}

// ============ ÓRDENES ============
async function renderOrdenes() {
  let ordenes = [];
  try { const d = await api('GET', '/api/ordenes'); ordenes = d.ordenes || []; } catch (e) { /* ignore */ }
  const estadoLabel = { pendiente: 'Pendiente', aprobada: 'Aprobada', en_curso: 'En Curso', aval_entregado: 'Aval Entregado', completada: 'Completada', cancelada: 'Cancelada' };

  const rows = ordenes.map(ot => {
    const prodHtml = ot.productos && ot.productos.length > 0
      ? ot.productos.map(p => `${escHtml(p.nombre)} x${p.cantidad}`).join(', ')
      : '<span class="text-gray-400">—</span>';

    // Build action buttons based on estado and user role
    let actions = '';
    if (ot.estado === 'pendiente') {
      if (state.user?.rol === 'admin' || (state.user?.rol === 'tecnico' && ot.tecnico_id === state.user.id)) {
        actions += `<button onclick="iniciarOT(${ot.id})" class="btn-icon bg-blue-50 hover:bg-blue-100 text-blue-600 hover:text-blue-700 border border-blue-200" title="Iniciar OT">▶️</button>`;
      }
      if (state.user?.rol === 'admin') {
        actions += `<button onclick="cancelarOT(${ot.id})" class="btn-icon bg-red-50 hover:bg-red-100 text-red-600 hover:text-red-700 border border-red-200" title="Cancelar OT">✕</button>`;
      }
    } else if (ot.estado === 'en_curso') {
      if (state.user?.rol === 'tecnico' || state.user?.rol === 'admin') {
        actions += `<button onclick="showModal('entrega-aval', ${ot.id})" class="btn-icon bg-green-50 hover:bg-green-100 text-green-600 hover:text-green-700 border border-green-200" title="Entregar Aval">📋</button>`;
      }
      if (state.user?.rol === 'admin') {
        actions += `<button onclick="cancelarOT(${ot.id})" class="btn-icon bg-red-50 hover:bg-red-100 text-red-600 hover:text-red-700 border border-red-200" title="Cancelar OT">✕</button>`;
      }
    } else if (ot.estado === 'aval_entregado') {
      actions += `<button onclick="verAval(${ot.aval_id || 0}, ${ot.id})" class="btn-icon bg-amber-50 hover:bg-amber-100 text-amber-600 hover:text-amber-700 border border-amber-200" title="Ver Aval">📄</button>`;
    } else if (ot.estado === 'completada') {
      if (ot.aval_estado === 'confirmado') {
        actions += `<button onclick="verAval(${ot.aval_id || 0}, ${ot.id})" class="btn-icon bg-green-50 hover:bg-green-100 text-green-600 hover:text-green-700 border border-green-200" title="Ver Aval">📄</button>`;
      }
    }

    return `
    <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
      <td class="py-3 px-4 font-medium text-blue-600 whitespace-nowrap">${ot.numero_ot}</td>
      <td class="py-3 px-4">${escHtml(ot.cliente_nombre)}</td>
      <td class="py-3 px-4"><span class="badge capitalize bg-gray-100 text-gray-700">${ot.tipo_servicio}</span></td>

async function uploadFirmado(id) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { toast('El archivo es muy grande (máx 10MB)', 'error'); return; }
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        await api('PUT', '/api/avales-legacy', { id, archivo_firmado: ev.target.result, respuestas_digitales: JSON.stringify({ firmado: true, fecha: new Date().toISOString() }) });
        toast('Aval firmado subido correctamente');
        render();
      } catch (err) { toast('Error: ' + err.message, 'error'); }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

  const trimestres = [

window.actualizarFechasBono = function () {
  const trimVal = parseInt(document.getElementById('bono-trimestre').value);
  const anio = new Date().getFullYear();
  const mInicio = (trimVal - 1) * 3 + 1;
  document.getElementById('bono-inicio').value = anio + '-' + String(mInicio).padStart(2,'0') + '-01';
  const mFin = mInicio + 2;
  document.getElementById('bono-fin').value = anio + '-' + String(mFin).padStart(2,'0') + '-31';
};

window.cargarReporteBono = async function () {
  const inicio = document.getElementById('bono-inicio').value;
  const fin = document.getElementById('bono-fin').value;
  const btn = document.getElementById('bono-btn');
  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Calculando...';

  try {
    const d = await api('GET', '/api/reporte/bono?inicio=' + inicio + '&fin=' + fin);
    document.getElementById('bono-resultado').innerHTML = renderBonoResultado(d);
    document.getElementById('bono-empty').innerHTML = '';
  } catch (e) {
    document.getElementById('bono-resultado').innerHTML = '<div class="card bg-red-50 border-red-200 text-red-700 p-4 text-center">Error: ' + escHtml(e.message) + '</div>';
  } finally {
    btn.disabled = false; btn.innerHTML = '<span>📊</span> Generar Reporte';
  }
};

window.calcularReporte = async function (generar) {
  const anio = document.getElementById('rep-anio').value;
  const trim = document.getElementById('rep-trim').value;
  const err = document.getElementById('rep-error');
  const success = document.getElementById('rep-success');
  const loading = document.getElementById('rep-resultado');
  err.classList.add('hidden');
  success.classList.add('hidden');

  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Calculando...'; }

  try {
    const d = await api('GET', `/api/reportes?action=${generar ? 'generar' : 'calcular'}&anio=${anio}&trimestre=${trim}`);
    if (d.saved) { success.textContent = '✓ Reporte guardado exitosamente'; success.classList.remove('hidden'); }
    document.getElementById('rep-resultado').innerHTML = renderResultadoReporte(d);
    document.getElementById('rep-empty').innerHTML = '';
    document.getElementById('rep-resultado').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = `<span>${generar ? '💾' : '📊'}</span> ${generar ? 'Generar Reporte' : 'Calcular'}`; }
  }
};

window.saveConfig = async function () {
  const btn = document.getElementById('cfg-save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Guardando...';

  const pondKeys = ['ponderacion_tiempo_entrega', 'ponderacion_desempeno', 'ponderacion_conocimientos', 'ponderacion_presentacion', 'ponderacion_calidad_productos', 'ponderacion_calidad_entrenamientos'];
  const valKeys = ['valor_cerradura', 'valor_control_acceso', 'valor_caja_fuerte', 'valor_ahorro_energia', 'mant_cerradura', 'mant_caja_fuerte', 'mant_ahorro_energia'];

  const body = {};

  for (const k of pondKeys) {
    const el = document.getElementById(`cfg-val-${k}`);
    body[k] = parseFloat(el?.textContent || 1.5);
  }

  for (const k of valKeys) {
    const el = document.getElementById(`cfg-valnum-${k}`);
    body[k] = parseFloat(el?.value || 0);
  }

  try {
    await api('PUT', '/api/config', body);
    toast('Configuración guardada correctamente');
    render();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>💾</span> Guardar Configuración';
  }
};

window.reloadConfig = function () {
  render();
};

const modals = {};

window.showModal = function (id, data) {
  modals[id] = { open: true, data: data };
  render();
};

window.closeModal = function (id) {
  delete modals[id];
  render();
};

function escHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatFecha(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('es-DO', { year: 'numeric', month: 'short', day: 'numeric' });
}

// ============ RENDER ============
async function render() {
  if (!state.token || !state.user) {
    document.getElementById('app').innerHTML = renderLogin();
    return;
  }

  const layout = renderLayout();
  document.getElementById('app').innerHTML = layout;

  const main = document.getElementById('main-content');
  let content = '';

  try {
    switch (state.view) {
      case 'inicio': content = await renderInicio(); break;
      case 'ordenes': content = await renderOrdenes(); break;
      case 'avales': content = await renderAvales(); break;
      case 'encuestas': content = await renderEncuestas(); break;
      case 'reportes': content = await renderReportes(); break;
      case 'bonos': content = await renderBonos(); break;
      case 'productos': content = await renderProductos(); break;
      case 'perfil': content = renderPerfil(); break;
      case 'usuarios': content = await renderUsuarios(); break;
      case 'config': content = await renderConfig(); break;
      default: content = await renderInicio();
    }
  } catch (e) {
    if (e.message.includes('401') || e.message.includes('No autorizado')) {
      handleLogout();
      return;
    }
    content = `<div class="card text-center py-12 fade-in"><span class="text-5xl block mb-4">⚠️</span><p class="text-red-500 text-lg mb-2">Error al cargar</p><p class="text-gray-400 text-sm mb-4">${escHtml(e.message)}</p><button onclick="render()" class="btn-primary">Reintentar</button></div>`;
  }

  main.innerHTML = content;

  // Modals after main content
  const modalKeys = Object.keys(modals);
  for (const key of modalKeys) {
    const modal = modals[key];
    if (key === 'nueva-ot') main.innerHTML += renderModalNuevaOT();
    if (key === 'nuevo-aval') main.innerHTML += renderModalNuevoAval();
    if (key === 'nueva-encuesta') main.innerHTML += renderModalNuevaEncuesta();
    if (key === 'nuevo-usuario') main.innerHTML += renderModalNuevoUsuario();
    if (key === 'entrega-aval' && modal.data) main.innerHTML += renderModalEntregaAval(modal.data);
    if (key === 'detalle-aval' && modal.data) main.innerHTML += renderModalDetalleAval(modal.data);
  }
}

window.guardarProducto = async function (e) {
  e.preventDefault();
  const err = document.getElementById('prod-error');
  err.classList.add('hidden');
  const id = document.getElementById('prod-id').value;
  const body = {
    nombre: document.getElementById('prod-nombre').value.trim(),
    categoria: document.getElementById('prod-categoria').value,
    descripcion: document.getElementById('prod-desc').value.trim(),
  };

  try {
    if (id) {
      await api('PUT', '/api/productos/' + id, body);
    } else {
      await api('POST', '/api/productos', body);
    }
    document.getElementById('producto-form-container').innerHTML = '';
    toast('Producto ' + (id ? 'actualizado' : 'creado') + ' correctamente');
    render();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  }
};

};

async function cargarProductosSelect() {
  try {
    const d = await api('GET', '/api/productos');
    _productos = d.productos || [];
    const sel = document.getElementById('ot-prod-select');
    if (sel) {
      sel.innerHTML = '<option value="">Seleccionar producto...</option>' +
        _productos.map(p => `<option value="${p.id}">${escHtml(p.nombre)}</option>`).join('');
    }
  } catch (e) { /* ignore */ }
}

window.agregarProductoOT = function () {
  const sel = document.getElementById('ot-prod-select');
  const cant = document.getElementById('ot-prod-cant');
  const pid = parseInt(sel.value);
  const qty = parseInt(cant.value) || 1;
  if (!pid) return;
  const prod = _productos.find(p => p.id === pid);
  if (!prod) return;

  const existing = _productosSeleccionados.findIndex(p => p.producto_id === pid);
  if (existing >= 0) {
    _productosSeleccionados[existing].cantidad += qty;
  } else {
    _productosSeleccionados.push({ producto_id: pid, nombre: prod.nombre, cantidad: qty });
  }
  actualizarListaProductosOT();
  sel.value = '';
  cant.value = '1';
};

function actualizarListaProductosOT() {
  const div = document.getElementById('ot-productos-list');
  if (!div) return;
  if (_productosSeleccionados.length === 0) {
    div.innerHTML = '<p class="text-xs text-gray-400 italic">No hay productos agregados</p>';
    return;
  }
  div.innerHTML = _productosSeleccionados.map((p, i) =>
    `<div class="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2">
      <div><span class="text-sm font-medium">${escHtml(p.nombre)}</span> <span class="text-sm text-gray-500">x${p.cantidad}</span></div>
      <button type="button" onclick="quitarProductoOT(${i})" class="text-red-500 hover:text-red-700 text-sm font-semibold">✕</button>
    </div>`
  ).join('');
}

window.quitarProductoOT = function (idx) {
  _productosSeleccionados.splice(idx, 1);
  actualizarListaProductosOT();
};

const _encValues = {};

window.setEncuestaVal = function (key, val) {
  _encValues[key] = val;
  for (let v = 1; v <= 5; v++) {
    const el = document.getElementById(`enc-${key}-${v}`);
    if (el) {
      el.className = `w-10 h-10 rounded-full text-sm font-semibold transition-all ${v <= val ? 'bg-yellow-400 text-yellow-900 shadow-sm' : 'bg-gray-200 text-gray-500 hover:bg-yellow-300 hover:text-yellow-800'}`;
    }
  }

  // Calculate
  const pesos = { tiempo_entrega: 1.5, desempeno_equipo: 1.5, conocimientos_tecnicos: 1.5, presentacion_equipo: 1.0, calidad_productos: 1.0, calidad_entrenamientos: 1.0 };
  const keys = ['satisfaccion_general', 'tiempo_entrega', 'desempeno_equipo', 'presentacion_equipo', 'calidad_productos', 'conocimientos_tecnicos', 'calidad_entrenamientos'];
  let sumP = 0, sumW = 0;
  for (const k of keys) {
    const v = _encValues[k] || 3;
    const w = k === 'satisfaccion_general' ? 1.0 : (pesos[k] || 1.0);
    sumP += v * w;
    sumW += w;
  }
  const pct = Math.round((sumP / sumW / 5) * 100);
  document.getElementById('enc-pct').textContent = pct + '%';
  document.getElementById('enc-pct-bar').style.width = pct + '%';
};

window.submitNuevaEncuesta = async function (e) {
  e.preventDefault();
  const err = document.getElementById('enc-error');
  err.classList.add('hidden');

  const otId = document.getElementById('enc-ot').value;
  if (!otId) { err.textContent = 'Selecciona una OT'; err.classList.remove('hidden'); return; }

  const keys = ['satisfaccion_general', 'tiempo_entrega', 'desempeno_equipo', 'presentacion_equipo', 'calidad_productos', 'conocimientos_tecnicos', 'calidad_entrenamientos'];
  const body = { orden_trabajo_id: Number(otId), recomendaria: 1 };
  for (const k of keys) body[k] = _encValues[k] || 3;
  body.observaciones = document.getElementById('enc-obs').value;

  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Guardando...';

  try {
    await api('POST', '/api/encuestas', body);
    closeModal('nueva-encuesta');
    toast('Encuesta registrada correctamente');
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Guardar Encuesta';
  }
};

window.submitCambiarPassword = async function (e) {
  e.preventDefault();
  const err = document.getElementById('pw-error');
  const success = document.getElementById('pw-success');
  err.classList.add('hidden');
  success.classList.add('hidden');

  const currentPassword = document.getElementById('pw-current').value;
  const newPassword = document.getElementById('pw-new').value;
  const confirmPassword = document.getElementById('pw-confirm').value;

  if (newPassword !== confirmPassword) {
    err.textContent = 'Las contraseñas nuevas no coinciden';
    err.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('pw-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Actualizando...';

  try {
    await api('PUT', '/api/auth/password', { currentPassword, newPassword });
    success.textContent = 'Contraseña actualizada correctamente';
    success.classList.remove('hidden');
    document.getElementById('pw-current').value = '';
    document.getElementById('pw-new').value = '';
    document.getElementById('pw-confirm').value = '';
    toast('Contraseña actualizada');
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Actualizar Contraseña';
  }
};

            <button type="button" onclick="closeModal('nuevo-usuario')" class="btn-secondary">Cancelar</button>
            <button type="submit" class="btn-primary">Crear Usuario</button>
          </div>
        </form>
      </div>
    </div>`;
}

window.submitNuevoUsuario = async function (e) {
  e.preventDefault();
  const err = document.getElementById('us-error');
  err.classList.add('hidden');

  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Creando...';

  try {
    await api('POST', '/api/usuarios', {
      nombre: document.getElementById('us-nombre').value.trim(),
      email: document.getElementById('us-email').value.trim(),
      password: document.getElementById('us-pass').value,
      rol: document.getElementById('us-rol').value,
      telefono: document.getElementById('us-tel').value.trim() || null,
    });
    closeModal('nuevo-usuario');
    toast('Usuario creado correctamente');
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Crear Usuario';
  }
};

// ============ INIT ============
// Preload OT completadas for encuestas modal on startup
let _otsCompletadas = [];

(async function init() {
  if (state.token && state.user) {
    state.view = 'inicio';
    try {
      const d = await api('GET', '/api/ordenes?estado=completada');
      _otsCompletadas = d.ordenes || [];
    } catch (e) { /* ignore */ }
    // Preload tecnicos
    loadTecnicos();
  }
  render();
})();

// Override render's enc-ot select population after modal opens
const origRender = render;
render = async function () {
  await origRender();
  // Populate enc-ot select if modal is open
  if (modals['nueva-encuesta']) {
    const sel = document.getElementById('enc-ot');
    if (sel) {
      sel.innerHTML = '<option value="">Seleccionar OT completada...</option>' +
        _otsCompletadas.map(o => `<option value="${o.id}">${o.numero_ot} — ${escHtml(o.cliente_nombre)}</option>`).join('');
    }
  }
};
</script>
