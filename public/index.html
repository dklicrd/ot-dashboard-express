<script>
// ============ STATE ============
const state = {
  token: localStorage.getItem('token') || null,
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  view: 'login',
  _toastTimer: null,
};

function setState(partial) {
  Object.assign(state, partial);
  render();
}

function toast(message, type = 'success') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (state._toastTimer) clearTimeout(state._toastTimer);

  const bg = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
  const el = document.createElement('div');
  el.className = `toast slide-up ${bg}`;
  el.textContent = message;
  document.body.appendChild(el);
  state._toastTimer = setTimeout(() => { el.remove(); }, 3500);
}

// ============ API HELPER ============
async function api(method, path, body) {
  const opts = { method, headers: { Authorization: `Bearer ${state.token}` } };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    // Si es 401 y no es una request de auth, redirigir a login
    if (res.status === 401 && path !== '/api/auth') {
      console.warn('[api] Token expirado/inválido (401), redirigiendo a login');
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      state.token = null;
      state.user = null;
      state.view = 'login';
      Promise.resolve().then(() => render());
      throw new Error('Sesión expirada. Inicia sesión nuevamente.');
    }
    throw new Error(data.error || `Error ${res.status}`);
  }
  return data;
}

async function uploadFile(path, formData) {
  const res = await fetch(path, {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + state.token },
    body: formData,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error ' + res.status);
  return data;
}

// ============ LOGIN ============
async function iniciarOT(id) {
  try {
    const r = await api('PUT', '/api/ordenes/' + id + '/estado', { estado: 'en_curso' });
    toast('OT iniciada correctamente - ' + (r.email === 'enviado' || r.email === 'enviando' ? 'Notificación por email enviada' : ''));
    render();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
};

async function cancelarOT(id) {
  if (!confirm('¿Estás seguro de cancelar esta OT? Si tiene un aval activo, será rechazado automáticamente.')) return;
  try {
    await api('PUT', '/api/ordenes/' + id + '/estado', { estado: 'cancelada' });
    toast('OT cancelada');
    render();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
};

async function eliminarOT(id, cliente, numeroOt) {
  if (!confirm(`¿Estás seguro de eliminar la ${numeroOt} de ${cliente}?\n\n⚠️ Esta acción eliminará permanentemente la orden de trabajo y todos sus registros asociados (productos, avales, encuestas).\n\nEsta acción NO se puede deshacer.`)) return;
  try {
    await api('DELETE', '/api/ordenes/' + id);
    toast('OT eliminada permanentemente');
    render();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
};

async function verAval(avalId, otId) {
  if (!avalId) {
    try {
      const d = await api('GET', '/api/avales?orden_trabajo_id=' + otId);
      const avales = d.avales || [];
      if (avales.length > 0) avalId = avales[0].id;
    } catch (e) { /* ignore */ }
  }
  if (avalId) {
    showModal('detalle-aval', avalId);
  } else {
    toast('No se encontró aval para esta OT', 'error');
  }
};

async function confirmarAval(avalId) {
  // Mostrar modal de confirmación con opción skip_survey
  const modal = document.getElementById('modal');
  if (!modal) return;
  modal.innerHTML = `
    <div class="modal-overlay fade-in" onclick="if(event.target===this)closeModal()">
      <div class="modal-content max-w-lg" onclick="event.stopPropagation()">
        <div class="p-6 border-b border-gray-200 flex items-center justify-between">
          <h2 class="text-xl font-bold">✅ Confirmar Aval</h2>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <div class="p-6 space-y-4">
          <p class="text-sm text-gray-600">¿Confirmar este aval y marcar la OT como completada?</p>

          <div class="border rounded-xl p-4 space-y-3">
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="checkbox" id="aval-skip-survey" onchange="toggleSkipSurvey()" class="w-5 h-5 rounded border-gray-300">
              <div>
                <span class="font-medium text-sm">🙋 Confirmación Express</span>
                <p class="text-xs text-gray-500">Omitir encuesta de satisfacción y seleccionar % de bono manualmente</p>
              </div>
            </label>
            <div id="skip-survey-options" class="hidden space-y-3 pl-8 border-l-2 border-blue-200 ml-2">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">% de Bono Asignado</label>
                <input type="range" id="aval-skip-pct" min="0" max="100" value="100" class="w-full" oninput="document.getElementById('aval-skip-pct-label').textContent=this.value+'%'">
                <div class="flex justify-between text-xs text-gray-400">
                  <span>0%</span>
                  <span id="aval-skip-pct-label" class="font-bold text-blue-600">100%</span>
                  <span>100%</span>
                </div>
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Motivo de confirmación express</label>
                <textarea id="aval-skip-motivo" class="input-field" rows="2" placeholder="Ej: Cliente no disponible para encuesta, conformidad verbal con Admin..."></textarea>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 text-sm text-yellow-700 bg-yellow-50 rounded-lg p-3">
            <span>⚠️</span>
            <span>La OT se marcará como completada y se calculará el bono correspondiente.</span>
          </div>

          <div class="flex justify-end gap-3 pt-2">
            <button onclick="closeModal()" class="btn-secondary">Cancelar</button>
            <button onclick="ejecutarConfirmarAval(${avalId})" class="btn-success flex items-center gap-2"><span>✅</span> Confirmar Aval</button>
          </div>
        </div>
      </div>
    </div>
  `;
  modal.style.display = 'flex';
}

window.toggleSkipSurvey = function() {
  const opt = document.getElementById('skip-survey-options');
  if (opt) opt.classList.toggle('hidden', !document.getElementById('aval-skip-survey')?.checked);
};

window.ejecutarConfirmarAval = async function (avalId) {
  const skipSurvey = document.getElementById('aval-skip-survey')?.checked || false;
  const skipSurveyPct = skipSurvey ? parseInt(document.getElementById('aval-skip-pct')?.value || '100') : null;
  const skipSurveyMotivo = skipSurvey ? (document.getElementById('aval-skip-motivo')?.value?.trim() || 'Conformidad verbal') : null;

  const productos = [];
  const inputs = document.querySelectorAll('[data-confirm-cantidad]');
  inputs.forEach(inp => {
    const pid = parseInt(inp.dataset.confirmCantidad);
    const val = parseInt(inp.value);
    if (!isNaN(val) && val >= 0) {
      productos.push({ producto_id: pid, cantidad_confirmada: val });
    }
  });

  try {
    const r = await api('PUT', '/api/avales/' + avalId + '/confirmar', {
      productos,
      skip_survey: skipSurvey,
      skip_survey_pct: skipSurveyPct,
      skip_survey_motivo: skipSurveyMotivo
    });
    closeModal();
    toast(r.message || (skipSurvey ? 'Aval confirmado sin encuesta.' : 'Aval confirmado. OT completada.'));
    render();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
};


function renderLogin() {
  return `
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-blue-900">
      <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
        <div class="text-center mb-8">
          <div class="text-5xl mb-4">🔐</div>
          <h1 class="text-3xl font-bold text-gray-900">OT Dashboard</h1>
          <p class="text-gray-500 mt-2">Gestión de Órdenes de Trabajo</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div id="login-error" class="hidden bg-red-50 text-red-700 px-4 py-3 rounded-lg text-sm border border-red-200"></div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input type="email" id="login-email" class="input-field" placeholder="admin@sistema.com" required autocomplete="email">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="login-pass" class="input-field" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn-primary w-full py-3 text-lg" id="login-btn">Iniciar Sesión</button>
        </form>
        <div class="mt-6 p-4 bg-gray-50 rounded-lg text-xs text-gray-500 text-center hidden">
          <strong>🔑 Acceso de prueba:</strong><br>
          Admin: <code>admin@sistema.com</code> / <code>admin123</code><br>
          Técnico: <code>maximo@sistema.com</code> / <code>tecnico123</code>
        </div>
      </div>
    </div>
  `;
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const errDiv = document.getElementById('login-error');

  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Iniciando...';
  errDiv.classList.add('hidden');

  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    setState({ token: data.token, user: data.user, view: 'inicio' });
    toast('Sesión iniciada correctamente');
  } catch (err) {
    errDiv.textContent = err.message;
    errDiv.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Iniciar Sesión';
  }
}

async function cargarAlertasEncuestas() {
  const container = document.getElementById('encuestas-alertas');
  if (!container) return;
  try {
    const d = await api('GET', '/api/encuestas');
    const encuestas = d.encuestas || [];
    let alertasHtml = '';

    const expiradas = encuestas.filter(function(e) { return e.estado === 'expirada' && !e.contactado_por; });
    for (var i = 0; i < Math.min(expiradas.length, 5); i++) {
      var e = expiradas[i];
      alertasHtml += '<div class="flex items-center gap-3 p-3 bg-red-50 border border-red-200 rounded-lg">' +
        '<span class="text-xl">\u26a0\ufe0f</span>' +
        '<div class="flex-1"><p class="text-sm font-medium text-red-800">Encuesta expirada: OT ' + escHtml(e.numero_ot) + '</p>' +
        '<p class="text-xs text-red-600">Cliente: ' + escHtml(e.aval_cliente_nombre || e.cliente_nombre) + ' \u00b7 Vencida hace ' + Math.abs(e.dias_restantes) + ' d\u00edas</p></div>' +
        '<div class="flex gap-2"><button onclick="showContactarEncuesta(' + e.id + ')" class="px-3 py-1.5 text-xs font-medium bg-red-600 text-white rounded-lg hover:bg-red-700">Contactar</button>' +
        '<button onclick="setState({view:\'ordenes\'});setTimeout(function(){abrirDetalleOT(' + e.orden_trabajo_id + ')},100)" class="px-3 py-1.5 text-xs font-medium bg-white border border-red-300 text-red-700 rounded-lg hover:bg-red-50">Ver OT</button></div></div>';
    }

    const prontas = encuestas.filter(function(e) { return e.estado === 'pendiente' && e.dias_restantes <= 1 && e.dias_restantes > 0; });
    for (var i = 0; i < Math.min(prontas.length, 5); i++) {
      var e = prontas[i];
      alertasHtml += '<div class="flex items-center gap-3 p-3 bg-yellow-50 border border-yellow-200 rounded-lg">' +
        '<span class="text-xl">\u23f0</span>' +
        '<div class="flex-1"><p class="text-sm font-medium text-yellow-800">Recordatorio pendiente: OT ' + escHtml(e.numero_ot) + '</p>' +
        '<p class="text-xs text-yellow-600">Vence en ' + e.dias_restantes + ' d\u00eda(s) h\u00e1bil(es)</p></div>' +
        '<button onclick="setState({view:\'encuestas\'})" class="px-3 py-1.5 text-xs font-medium bg-yellow-600 text-white rounded-lg hover:bg-yellow-700">Ver Encuestas</button></div>';
    }

    const nuevas = encuestas.filter(function(e) { return e.estado === 'pendiente' && e.dias_restantes > 1; });
    for (var i = 0; i < Math.min(nuevas.length, 3); i++) {
      var e = nuevas[i];
      alertasHtml += '<div class="flex items-center gap-3 p-3 bg-blue-50 border border-blue-200 rounded-lg">' +
        '<span class="text-xl">\ud83d\udcdd</span>' +
        '<div class="flex-1"><p class="text-sm font-medium text-blue-800">Encuesta pendiente: OT ' + escHtml(e.numero_ot) + '</p>' +
        '<p class="text-xs text-blue-600">Vence en ' + e.dias_restantes + ' d\u00eda(s) h\u00e1bil(es)</p></div>' +
        '<button onclick="setState({view:\'encuestas\'})" class="px-3 py-1.5 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700">Ver Encuestas</button></div>';
    }

    container.innerHTML = alertasHtml || '<div class="text-center py-2 text-sm text-gray-400">Todos las encuestas est\u00e1n al d\u00eda</div>';
  } catch (e) {
    console.error('Error cargando alertas encuestas:', e);
  }
}

function barraProgreso(label, val, total, color) {
  const pct = Math.round((val / total) * 100);
  return `<div class="mb-4"><div class="flex justify-between text-sm mb-1"><span class="text-gray-600">${label}</span><span class="font-semibold">${val}</span></div><div class="w-full bg-gray-200 rounded-full h-2.5"><div class="${color} h-2.5 rounded-full transition-all duration-500" style="width:${pct}%"></div></div></div>`;
}

            <tbody>${ordenes.length === 0 ? '<tr><td colspan="9" class="text-center py-12 text-gray-400"><span class="text-4xl block mb-2">📋</span>No hay órdenes de trabajo</td></tr>' : rows}</tbody>

async function uploadFirmado(id) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { toast('El archivo es muy grande (máx 10MB)', 'error'); return; }
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        await api('PUT', '/api/avales-legacy', { id, archivo_firmado: ev.target.result, respuestas_digitales: JSON.stringify({ firmado: true, fecha: new Date().toISOString() }) });
        toast('Aval firmado subido correctamente');
        render();
      } catch (err) { toast('Error: ' + err.message, 'error'); }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// ============ ENCUESTAS ============
async function renderEncuestas() {
  try {
    const d = await api('GET', '/api/encuestas');
    const encuestas = d.encuestas || [];

    const rows = encuestas.map(e => {
      let estadoBadge = '';
      if (e.estado === 'completada') {
        estadoBadge = '<span class="badge badge-success flex items-center gap-1">✅ ' + (e.porcentaje_final || 0) + '%</span>';
      } else if (e.estado === 'expirada') {
        estadoBadge = '<span class="badge badge-error flex items-center gap-1">❌ Expirada</span>';
      } else {
        estadoBadge = '<span class="badge badge-warning flex items-center gap-1">⏳ Pendiente</span>';
      }

      let diasBadge = '';
      if (e.dias_restantes > 0 && e.estado === 'pendiente') {
        diasBadge = '<span class="text-xs text-blue-600">' + e.dias_restantes + ' días</span>';
      } else if (e.dias_restantes <= 0 && e.estado === 'pendiente') {
        diasBadge = '<span class="text-xs text-red-600 font-semibold">⚠️ Vence hoy</span>';
      } else if (e.estado === 'expirada') {
        diasBadge = '<span class="text-xs text-red-600">Expirada</span>';
      }

      const accionesBtn = e.estado === 'expirada' || (e.estado === 'pendiente' && e.fecha_limite && e.fecha_limite < new Date().toISOString().split('T')[0])
        ? '<button class="text-sm px-3 py-1 rounded-lg bg-orange-50 text-orange-700 hover:bg-orange-100" onclick="renderModalContactarEncuesta(' + e.id + ')">📞 Contactar</button>'
        : e.estado === 'pendiente'
          ? '<span class="text-xs text-gray-400">Esperando respuesta...</span>'
          : '<span class="text-xs text-green-600">' + (e.fecha_encuesta ? new Date(e.fecha_encuesta).toLocaleDateString() : 'Completada') + '</span>';

      return '<tr>' +
        '<td class="py-3 px-3">' + escHtml(e.numero_ot) + '</td>' +
        '<td class="py-3 px-3">' + escHtml(e.numero_encuesta || 'ENC-' + e.id) + '</td>' +
        '<td class="py-3 px-3">' + escHtml(e.cliente_nombre) + '</td>' +
        '<td class="py-3 px-3">' + estadoBadge + '</td>' +
        '<td class="py-3 px-3 text-sm">' + (e.fecha_limite || '-') + '</td>' +
        '<td class="py-3 px-3">' + diasBadge + '</td>' +
        '<td class="py-3 px-3">' + accionesBtn + '</td>' +
        '</tr>';
    }).join('');

    return `
      <div class="fade-in">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
          <h2 class="text-2xl font-bold text-gray-900">⭐ Encuestas de Satisfacción</h2>
          <button class="btn-primary flex items-center gap-2" onclick="renderModalNuevaEncuesta()">
            <span>+</span> Nueva Encuesta
          </button>
        </div>

        <div class="card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead>
                <tr class="bg-gray-50 border-b border-gray-200">
                  <th class="text-left py-3 px-3 font-semibold text-gray-600 text-xs uppercase">OT</th>
                  <th class="text-left py-3 px-3 font-semibold text-gray-600 text-xs uppercase">ID Encuesta</th>
                  <th class="text-left py-3 px-3 font-semibold text-gray-600 text-xs uppercase">Cliente</th>
                  <th class="text-left py-3 px-3 font-semibold text-gray-600 text-xs uppercase">Estado</th>
                  <th class="text-left py-3 px-3 font-semibold text-gray-600 text-xs uppercase">Fecha Límite</th>
                  <th class="text-left py-3 px-3 font-semibold text-gray-600 text-xs uppercase">Días Rest.</th>
                  <th class="text-left py-3 px-3 font-semibold text-gray-600 text-xs uppercase">Acción</th>
                </tr>
              </thead>
              <tbody>${rows || '<tr><td colspan="7" class="text-center py-8 text-gray-400">No hay encuestas registradas</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  } catch (e) {
    console.error('Error loading encuestas:', e);
    return '<div class="text-center py-8 text-red-500">Error al cargar encuestas: ' + e.message + '</div>';
  }
}

async function renderModalContactarEncuesta(encuestaId) {
  const container = document.getElementById('modal-content');
  try {
    const d = await api('GET', '/api/encuestas?id=' + encuestaId);
    const e = (d.encuestas || [])[0];
    if (!e) { toast('Encuesta no encontrada', 'error'); return; }

    const diasVencido = Math.abs(e.dias_restantes || 0);
    container.innerHTML = `
      <div class="modal-overlay fade-in" onclick="if(event.target===this)closeAllModals()" id="contactar-enc-overlay">
        <div class="modal-content max-w-lg">
          <div class="p-6 border-b border-gray-200 flex items-center justify-between">
            <h2 class="text-xl font-bold flex items-center gap-2">📞 Contactar Cliente</h2>
            <button onclick="closeAllModals()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
          </div>
          <div class="p-6 space-y-4">
            <div class="bg-orange-50 rounded-xl p-4 text-sm space-y-2">
              <p><strong>OT:</strong> ${escHtml(e.numero_ot)}</p>
              <p><strong>Cliente:</strong> ${escHtml(e.cliente_nombre)}</p>
              <p><strong>Fecha Límite:</strong> ${e.fecha_limite || 'N/A'}</p>
              <p><strong>Días vencido:</strong> <span class="text-red-600 font-semibold">${diasVencido} días</span></p>
              <p><strong>Email:</strong> ${escHtml(e.cliente_email) || 'No registrado'}</p>
              <p><strong>Teléfono:</strong> ${escHtml(e.aval_cliente_telefono || e.cliente_telefono || 'No registrado')}</p>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Notas de Contacto</label>
              <textarea id="contactar-notas" class="input-field w-full" rows="3" placeholder="¿Cómo se contactó al cliente? ¿Qué respondió?"></textarea>
            </div>
            <div class="flex justify-end gap-3">
              <button class="btn-secondary" onclick="closeAllModals()">Cancelar</button>
              <button class="btn-primary" onclick="submitContactarEncuesta(${encuestaId})">Marcar como Contactado</button>
            </div>
          </div>
        </div>
      </div>
    `;
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  }
}

async function submitContactarEncuesta(encuestaId) {
  try {
    const notas = document.getElementById('contactar-notas').value;
    await api('PUT', '/api/encuestas/' + encuestaId + '/contactar', { notas_contacto: notas });
    toast('✅ Contacto registrado exitosamente', 'success');
    closeAllModals();
    if (state.view === 'encuestas') render();
    if (state.view === 'inicio') initEncuestasAlertas();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════
// ALERTAS de encuestas pendientes en inicio
// ═══════════════════════════════════════════════
async function initEncuestasAlertas() {
  const container = document.getElementById('encuestas-alertas');
  if (!container) return;
  try {
    const d = await api('GET', '/api/encuestas');
    const todas = d.encuestas || [];
    const pendientes = todas.filter(e => e.estado === 'pendiente' || e.estado === 'expirada');
    if (pendientes.length === 0) {
      container.innerHTML = '';
      return;
    }

    const ahora = new Date().toISOString().split('T')[0];
    const alertas = pendientes.map(e => {
      let tipo = 'info';
      let icono = '📝';
      let color = 'bg-blue-50 border-blue-200 text-blue-800';

      if (e.estado === 'expirada' || (e.fecha_limite && e.fecha_limite < ahora)) {
        tipo = 'danger';
        icono = '⚠️';
        color = 'bg-red-50 border-red-200 text-red-800';
      } else if (e.dias_restantes <= 0) {
        tipo = 'warning';
        icono = '⏰';
        color = 'bg-yellow-50 border-yellow-200 text-yellow-800';
      }

      return `<div class="${color} border rounded-lg px-4 py-3 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="text-lg">${icono}</span>
          <div>
            <p class="font-medium text-sm">${e.estado === 'expirada' ? 'Cliente sin contactar: ' : 'Encuesta pendiente: '} OT ${escHtml(e.numero_ot)}</p>
            <p class="text-xs opacity-75">${escHtml(e.cliente_nombre)}${e.fecha_limite ? ' · Límite: ' + e.fecha_limite : ''}</p>
          </div>
        </div>
        <div class="flex gap-2 shrink-0">
          <button class="text-xs px-3 py-1.5 rounded-lg font-medium bg-white bg-opacity-60 hover:bg-opacity-100 transition-colors" onclick="setState({view:'ordenes'})">Ver OT</button>
          ${tipo === 'danger' ? `<button class="text-xs px-3 py-1.5 rounded-lg font-medium bg-white bg-opacity-60 hover:bg-opacity-100 transition-colors" onclick="renderModalContactarEncuesta(${e.id})">📞 Contactar</button>` : ''}
        </div>
      </div>`;
    });

    container.innerHTML = '<div class="space-y-2">' + alertas.join('') + '</div>';
  } catch (e) {
    console.error('Error loading encuesta alertas:', e);
  }
}

function _tocarCliente() {
  _clienteTocado = true;
  _checkClienteForm();
}

function _checkClienteForm() {
  const btn = document.getElementById('ent-btn-confirmar-cliente');
  if (!btn || _datosClienteConfirmados) return;
  if (!_clienteTocado) { btn.disabled = true; return; }
  const nombre = document.getElementById('ent-cliente-nombre')?.value?.trim();
  const contacto = document.getElementById('ent-cliente-contacto')?.value?.trim();
  const cedula = document.getElementById('ent-cliente-cedula')?.value?.trim();
  const telefono = document.getElementById('ent-cliente-telefono')?.value?.trim();
  const email = document.getElementById('ent-cliente-email')?.value?.trim();
  btn.disabled = !(nombre && contacto && cedula && telefono && email);
}

function _checkPuedeEntregar() {
  const btn = document.getElementById('ent-btn-entregar');
  if (!btn) return;
  btn.disabled = !(_datosClienteConfirmados && _cantidadesConfirmadas);
}

function _confirmarCliente() {
  const nombre = document.getElementById('ent-cliente-nombre')?.value?.trim();
  const contacto = document.getElementById('ent-cliente-contacto')?.value?.trim();
  const cedula = document.getElementById('ent-cliente-cedula')?.value?.trim();
  const telefono = document.getElementById('ent-cliente-telefono')?.value?.trim();
  const email = document.getElementById('ent-cliente-email')?.value?.trim();
  if (!nombre || !contacto || !cedula || !telefono || !email) {
    toast('Completa todos los campos del cliente: Nombre, Contacto, Cédula, Teléfono y Email', 'error');
    return;
  }

  _datosClienteConfirmados = true;
  const btn = document.getElementById('ent-btn-confirmar-cliente');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '✅ Cliente Registrado';
    btn.classList.remove('bg-green-600', 'hover:bg-green-700');
    btn.classList.add('bg-green-700', 'cursor-default', 'opacity-70');
  }
  document.querySelectorAll('#ent-cliente-nombre, #ent-cliente-contacto, #ent-cliente-telefono, #ent-cliente-cedula, #ent-cliente-email').forEach(inp => inp.disabled = true);
  _checkPuedeEntregar();
}

function _confirmarCantidades() {
  _cantidadesConfirmadas = true;
  const btn = document.getElementById('ent-btn-confirmar-cant');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '✅ Cantidades Confirmadas';
    btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
    btn.classList.add('bg-green-600', 'cursor-default');
  }
  // Deshabilitar inputs de cantidad
  document.querySelectorAll('[id^="ent-cant-"]').forEach(inp => inp.disabled = true);
  _checkPuedeEntregar();
}

window.submitEntregaAval = async function (otId) {
  if (!_cantidadesConfirmadas) { toast('Debes confirmar las cantidades primero', 'error'); return; }
  if (!_datosClienteConfirmados) { toast('Debes registrar los datos del cliente primero', 'error'); return; }

  const observaciones = document.getElementById('ent-observaciones')?.value?.trim();
  if (!observaciones) { toast('Debes escribir observaciones generales antes de entregar el aval', 'error'); return; }

  const clienteNombre = document.getElementById('ent-cliente-nombre')?.value?.trim();
  const clienteContacto = document.getElementById('ent-cliente-contacto')?.value?.trim();
  const clienteTelefono = document.getElementById('ent-cliente-telefono')?.value?.trim();

  const productos = _productosOT.map(p => ({
    producto_id: p.id,
    cantidad: p.cantidad_real !== undefined ? p.cantidad_real : p.cantidad,
    comentario: p.comentario || ''
  }));

  const body = {
    orden_trabajo_id: otId,
    cliente_nombre: clienteNombre,
    cliente_contacto: document.getElementById('ent-cliente-contacto')?.value || '',
    cliente_cedula: document.getElementById('ent-cliente-cedula')?.value || '',
    cliente_telefono: document.getElementById('ent-cliente-telefono')?.value || '',
    cliente_email: document.getElementById('ent-cliente-email')?.value || '',
    observaciones: observaciones,
    productos: productos
  };

  const btn = event.target;
  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Entregando...';

  try {
    const r = await api('POST', '/api/avales', body);
    closeModal('entrega-aval');
    toast('✅ Aval entregado correctamente.');
    // Recargar la pagina para evitar cualquier error de render post-entrega
    setTimeout(function() { location.reload(); }, 800);
  } catch (e) {
    toast('Error: ' + e.message, 'error');
    btn.disabled = false; btn.textContent = 'Entregar Aval ✅';
  }
};

async function compartirAval(avalId, renovar) {
  try {
    let url = '/api/avales/' + avalId + '/compartir';
    if (renovar) url += '?renovar=true';
    const d = await api('POST', url, {});
    if (d.url) {
      // Actualizar UI
      renderEstadoCompartir(avalId);
      // Copiar al portapapeles
      try {
        await navigator.clipboard.writeText(d.url);
        toast('✅ Enlace copiado al portapapeles', 'success');
      } catch(e) {
        toast('✅ Enlace generado', 'success');
      }
    }
  } catch (e) {
    toast('Error al generar enlace: ' + e.message, 'error');
  }
}

async function renderEstadoCompartir(avalId) {
  try {
    const d = await api('GET', '/api/avales/' + avalId + '/compartir', {});
    const container = document.getElementById('compartir-estado-' + avalId);
    if (!container) return;
    
    const tiempoEnviado = d.token_enviado_en ? new Date(d.token_enviado_en + 'Z').toLocaleString('es-DO', { timeZone: 'America/Santo_Domingo' }) : null;
    const tiempoVisto = d.token_visto_en ? new Date(d.token_visto_en + 'Z').toLocaleString('es-DO', { timeZone: 'America/Santo_Domingo' }) : null;
    const tiempoFirma = d.fecha_firma ? new Date(d.fecha_firma + 'Z').toLocaleString('es-DO', { timeZone: 'America/Santo_Domingo' }) : null;
    
    let statusHTML = '';
    if (d.enlace) {
      statusHTML += `
        <div class="flex items-center gap-2 text-xs mb-2">
          <span class="text-gray-500">🔗 Enlace:</span>
          <code class="text-blue-600 bg-blue-50 px-2 py-0.5 rounded text-xs truncate max-w-[300px] inline-block">${escHtml(d.enlace)}</code>
          <button onclick="navigator.clipboard.writeText('${escHtml(d.enlace)}'); toast('✅ Copiado', 'success')" class="text-blue-600 hover:text-blue-800 text-xs">📋</button>
        </div>`;
      
      const steps = [
        { label: 'Generado', done: !!d.token_enviado_en, time: tiempoEnviado },
        { label: 'Visto por Cliente', done: !!d.token_visto_en, time: tiempoVisto },
        { label: 'Firmado por Cliente', done: !!d.fecha_firma, time: tiempoFirma },
      ];
      
      statusHTML += '<div class="flex items-center gap-4 mt-2">';
      steps.forEach((s, i) => {
        const icon = s.done ? '✅' : '⏳';
        const color = s.done ? 'text-green-600' : 'text-gray-400';
        statusHTML += `
          <div class="flex items-center gap-1 ${color}">
            <span>${icon}</span>
            <span class="text-xs">${s.label}</span>
            ${s.time ? `<span class="text-[10px] text-gray-400">(${s.time})</span>` : ''}
            ${i < steps.length - 1 ? '<span class="text-gray-300 mx-1">→</span>' : ''}
          </div>`;
      });
      statusHTML += '</div>';
    } else {
      statusHTML = '<p class="text-sm text-gray-400">Aún no se ha generado un enlace para compartir.</p>';
    }
    
    container.innerHTML = statusHTML;
  } catch (e) {
    console.error('Error loading compartir status:', e);
  }
}

window.reconsiderarAval = async function(avalId) {
  const motivo = prompt('Describe las correcciones realizadas:');
  if (!motivo || !motivo.trim()) { toast('Debes describir las correcciones', 'error'); return; }
  try {
    const r = await api('PUT', '/api/avales/' + avalId + '/reconsiderar', { nuevo_motivo: motivo.trim() });
    toast('🔄 ' + (r.message || 'Aval reconsiderado. OT vuelve a aval_entregado.'));
    closeModal();
    render();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
};

window.reabrirOT = async function(avalId) {
  if (!confirm('⚠️ ¿Estás seguro de reabrir esta OT? Se aplicará una penalidad del 50% en el bono.\n\nSolo posible si NO tiene encuesta completada.')) return;
  try {
    const r = await api('PUT', '/api/avales/' + avalId + '/reabrir', {});
    toast('↩️ ' + (r.message || 'OT reabierta con penalidad del 50%'));
    closeModal();
    render();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
};

async function rechazarAval(avalId) {
  if (!confirm('¿Estás seguro de rechazar este aval por calidad? La OT pasará a En Revisión (alerta ROJA).')) return;
  const motivo = prompt('Motivo del rechazo por calidad:');
  if (!motivo || !motivo.trim()) { toast('Debes especificar un motivo', 'error'); return; }
  try {
    const r = await api('PUT', '/api/avales/' + avalId + '/rechazar', { motivo: motivo.trim() });
    toast('🚨 ' + (r.message || 'Aval rechazado por calidad'));
    closeModal();
    render();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

// Confirmar aval al 100%
async function confirmarAval100(avalId) {
  if (!confirm('¿Estás seguro de confirmar este aval al 100%? Todos los productos quedarán con las cantidades originales de la OT.')) return;
  try {
    const r = await api('PUT', '/api/avales-legacy/' + avalId + '/confirmar');
    toast('✅ ' + (r.message || 'Aval confirmado al 100%'));
    closeModal();
    render();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

// Habilitar edición de cantidades
function habilitarEditarCantidades(avalId) {
  const inputs = document.querySelectorAll('.aval-cantidad-input');
  inputs.forEach(inp => {
    inp.disabled = false;
    inp.style.backgroundColor = '#fff';
    inp.style.borderColor = '#3b82f6';
  });
  const cont = document.querySelectorAll('.flex.justify-end.pt-2');
  if (cont && cont.length > 0) {
    cont[0].innerHTML = `
      <a href="/api/avales/${avalId}/pdf" target="_blank" class="btn-secondary flex items-center gap-2"><span>🖨️</span> PDF</a>
      <button onclick="guardarCambiosAval(${avalId})" class="btn-success flex items-center gap-2"><span>💾</span> Guardar cambios</button>
      <button onclick="closeModal();render()" class="btn-secondary flex items-center gap-2"><span>❌</span> Cancelar</button>
    `;
  }
}

// Guardar cambios y actualizar OT + bono
async function guardarCambiosAval(avalId) {
  const inputs = document.querySelectorAll('.aval-cantidad-input');
  const productos = [];
  inputs.forEach(inp => {
    const prodId = inp.dataset.prodId;
    const cantidad = parseInt(inp.value) || 0;
    productos.push({ producto_id: parseInt(prodId), cantidad });
  });

  if (!confirm('¿Guardar cambios? Se actualizarán las cantidades en la OT y se recalculará el bono del técnico.')) return;

  try {
    const r = await api('PUT', '/api/avales-legacy/' + avalId + '/productos', { productos });
    toast('✅ ' + (r.message || 'Cambios guardados') + ' — Bono: RD$' + (r.bono_tecnico || 0));
    closeModal();
    render();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

function subirFirmaFisicaModal(avalId) {
  const modal = document.getElementById('modal');
  if (!modal) return;
  modal.innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal-content max-w-md" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold">📸 Subir Foto de Firma Física</h2>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div>
        <p class="text-sm text-gray-500 mb-4">Selecciona una foto del aval firmado físicamente por el cliente.</p>
        <input type="file" accept="image/*" id="firma-fisica-input" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 mb-4">
        <div id="firma-preview" class="hidden mb-4">
          <img id="firma-preview-img" class="max-h-40 border rounded-lg mx-auto">
        </div>
        <div class="flex justify-end gap-3">
          <button onclick="closeModal()" class="btn-secondary">Cancelar</button>
          <button onclick="subirFirmaFisica(${avalId})" class="btn-success">📸 Subir y Confirmar</button>
        </div>
      </div>
    </div>
  `;
  modal.style.display = 'flex';

  // Preview
  document.getElementById('firma-fisica-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const preview = document.getElementById('firma-preview');
    const img = document.getElementById('firma-preview-img');
    img.src = URL.createObjectURL(file);
    preview.classList.remove('hidden');
  });
}

async function subirFirmaFisica(avalId) {
  const input = document.getElementById('firma-fisica-input');
  if (!input || !input.files || !input.files[0]) {
    toast('Selecciona una imagen primero', 'error');
    return;
  }
  const formData = new FormData();
  formData.append('firma', input.files[0]);
  try {
    const r = await uploadFile('/api/avales/' + avalId + '/subir-firma', formData);
    toast('✅ ' + (r.message || 'Firma subida correctamente'));
    closeModal();
    render();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

// ============ BONOS (NUEVO) ============
async function renderBonos() {
  const now = new Date();
  const trim = Math.ceil((now.getMonth() + 1) / 3);
  const anio = now.getFullYear();
  const qInicio = anio + '-' + String((trim-1)*3+1).padStart(2,'0') + '-01';
  const qFin = anio + '-' + String((trim-1)*3+3).padStart(2,'0') + '-31';

  const trimestres = [
    { v: '1', l: 'Q1 ' + anio + ' (Ene-Mar)' },
    { v: '2', l: 'Q2 ' + anio + ' (Abr-Jun)' },
    { v: '3', l: 'Q3 ' + anio + ' (Jul-Sep)' },
    { v: '4', l: 'Q4 ' + anio + ' (Oct-Dic)' },
  ];

  return `
    <div class="fade-in">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Reporte de Bonos Trimestral</h1>
      </div>
      <div class="card mb-6">
        <div class="flex flex-wrap gap-4 items-end">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Trimestre</label>
            <select id="bono-trimestre" class="select-field w-40" onchange="actualizarFechasBono()">
              ${trimestres.map(t => '<option value="' + t.v + '" ' + (String(trim) === t.v ? 'selected' : '') + '>' + t.l + '</option>').join('')}
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Desde</label>
            <input type="date" id="bono-inicio" class="input-field" value="'${qInicio}'">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasta</label>
            <input type="date" id="bono-fin" class="input-field" value="'${qFin}'">
          </div>
          <button onclick="cargarReporteBono()" class="btn-primary flex items-center gap-2" id="bono-btn">
            <span>📊</span> Generar Reporte
          </button>
        </div>
      </div>
      <div id="bono-resultado"></div>
      <div id="bono-empty" class="card text-center py-16">
        <span class="text-6xl mb-4 inline-block">💰</span>
        <p class="text-gray-500 text-lg">Selecciona un período y haz clic en <strong>"Generar Reporte"</strong></p>
        <p class="text-gray-400 text-sm mt-2">Reporte de bonos basado en OT completadas con aval confirmado</p>
      </div>
    </div>
  `;
}

window.actualizarFechasBono = function () {
  const trimVal = parseInt(document.getElementById('bono-trimestre').value);
  const anio = new Date().getFullYear();
  const mInicio = (trimVal - 1) * 3 + 1;
  document.getElementById('bono-inicio').value = anio + '-' + String(mInicio).padStart(2,'0') + '-01';
  const mFin = mInicio + 2;
  document.getElementById('bono-fin').value = anio + '-' + String(mFin).padStart(2,'0') + '-31';
};

window.cargarReporteBono = async function () {
  const inicio = document.getElementById('bono-inicio').value;
  const fin = document.getElementById('bono-fin').value;
  const btn = document.getElementById('bono-btn');
  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Calculando...';

  try {
    const d = await api('GET', '/api/reporte/bono?inicio=' + inicio + '&fin=' + fin);
    document.getElementById('bono-resultado').innerHTML = renderBonoResultado(d);
    document.getElementById('bono-empty').innerHTML = '';
  } catch (e) {
    document.getElementById('bono-resultado').innerHTML = '<div class="card bg-red-50 border-red-200 text-red-700 p-4 text-center">Error: ' + escHtml(e.message) + '</div>';
  } finally {
    btn.disabled = false; btn.innerHTML = '<span>📊</span> Generar Reporte';
  }
};

    if (p.evaluacion) {
      evText = p.evaluacion.promedio.toFixed(2) + '/5';
      if (p.evaluacion.promedio >= 4) evClass = 'text-green-600';
      else if (p.evaluacion.promedio >= 3) evClass = 'text-yellow-600';
      else evClass = 'text-red-600';

    return '<tr class="border-b border-gray-100 hover:bg-gray-50 text-xs">' +

  const trim = Math.ceil((new Date().getMonth() + 1) / 3);

  return `
    <div class="fade-in">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Reporte de Incentivo Trimestral</h1>
      <div class="card mb-6">
        <div class="flex flex-wrap gap-4 items-end">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Año</label>
            <select id="rep-anio" class="select-field w-32">${[2024, 2025, 2026, 2027].map(a => `<option value="${a}" ${a === anio ? 'selected' : ''}>${a}</option>`).join('')}</select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Trimestre</label>
            <select id="rep-trim" class="select-field w-40">

      </div>
    </div>
  `;
}

window.calcularReporte = async function (generar) {
  const anio = document.getElementById('rep-anio').value;
  const trim = document.getElementById('rep-trim').value;
  const err = document.getElementById('rep-error');
  const success = document.getElementById('rep-success');
  const loading = document.getElementById('rep-resultado');
  err.classList.add('hidden');
  success.classList.add('hidden');

  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Calculando...'; }

  try {
    const d = await api('GET', `/api/reportes?action=${generar ? 'generar' : 'calcular'}&anio=${anio}&trimestre=${trim}`);
    if (d.saved) { success.textContent = '✓ Reporte guardado exitosamente'; success.classList.remove('hidden'); }
    document.getElementById('rep-resultado').innerHTML = renderResultadoReporte(d);
    document.getElementById('rep-empty').innerHTML = '';
    document.getElementById('rep-resultado').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = `<span>${generar ? '💾' : '📊'}</span> ${generar ? 'Generar Reporte' : 'Calcular'}`; }
  }
};

function renderResultadoReporte(r) {
  const fm = n => `RD$ ${(n || 0).toLocaleString('es-DO', { minimumFractionDigits: 2 })}`;

  const evalItems = [
    { label: 'Tiempo de Entrega', val: r.evaluaciones.tiempo_entrega / 5 * 100 },

    { label: 'Presentación del Equipo', val: r.evaluaciones.presentacion / 5 * 100 },
    { label: 'Calidad de Productos', val: r.evaluaciones.calidad_productos / 5 * 100 },
    { label: 'Calidad de Entrenamientos', val: r.evaluaciones.calidad_entrenamientos / 5 * 100 },

  return `
    <div class="space-y-6 fade-in">
      <div class="card">
        <h3 class="card-header">Resumen — ${r.periodo}</h3>

          <div class="p-4 bg-blue-50 rounded-xl text-center"><p class="text-3xl font-bold text-blue-700">${r.resumen.instalaciones}</p><p class="text-xs text-blue-600 mt-1 uppercase tracking-wider font-medium">Instalaciones</p></div>
          <div class="p-4 bg-green-50 rounded-xl text-center"><p class="text-3xl font-bold text-green-700">${r.resumen.mantenimientos}</p><p class="text-xs text-green-600 mt-1 uppercase tracking-wider font-medium">Mantenimientos</p></div>
          <div class="p-4 bg-purple-50 rounded-xl text-center"><p class="text-3xl font-bold text-purple-700">${r.proyectos_count}</p><p class="text-xs text-purple-600 mt-1 uppercase tracking-wider font-medium">Total Servicios</p></div>
        </div>
      </div>

      <div class="card">
        <h3 class="card-header">Evaluaciones Promedio</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${evalItems.map(e => `
            <div><div class="flex justify-between text-sm mb-1"><span class="text-gray-600">${e.label}</span><span class="font-semibold">${Math.round(e.val)}%</span></div>
            <div class="w-full bg-gray-200 rounded-full h-2.5"><div class="bg-blue-500 h-2.5 rounded-full transition-all duration-500" style="width:${e.val}%"></div></div></div>
          `).join('')}
        </div>

window.saveConfig = async function () {
  const btn = document.getElementById('cfg-save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Guardando...';

  const pondKeys = ['ponderacion_tiempo_entrega', 'ponderacion_desempeno', 'ponderacion_conocimientos', 'ponderacion_presentacion', 'ponderacion_calidad_productos', 'ponderacion_calidad_entrenamientos'];

  const body = {};

  for (const k of pondKeys) {
    const el = document.getElementById(`cfg-val-${k}`);
    body[k] = parseFloat(el?.textContent || 1.5);
  }

  try {
    await api('PUT', '/api/config', body);
    toast('Ponderaciones guardadas correctamente');
    render();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>💾</span> Guardar Configuración';
  }
};

window.reloadConfig = function () {
  render();
};

window.previewLogo = function (input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast('El archivo es muy grande (max 2MB)', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function (e) {
    document.getElementById('doc-logo-preview').innerHTML = '<img src="' + e.target.result + '" class="h-20 w-auto rounded-lg border border-gray-200 p-1 bg-white" alt="Vista previa">';
  };
  reader.readAsDataURL(file);
};

window.saveDocConfig = async function () {
  const btn = document.getElementById('doc-save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Guardando...';

  const logoFile = document.getElementById('doc-logo-input').files[0];
  let logo_base64 = null;

  if (logoFile) {
    logo_base64 = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(logoFile);
    });
  }

  const body = {};
  const fields = [
    ['nombre_empresa', 'doc-nombre-empresa'],
    ['eslogan', 'doc-eslogan'],
    ['direccion', 'doc-direccion'],
    ['telefono', 'doc-telefono'],
    ['email', 'doc-email'],
    ['website', 'doc-website'],
    ['pie_pagina', 'doc-pie-pagina'],
  ];

  for (const [key, elId] of fields) {
    const el = document.getElementById(elId);
    if (el) body[key] = el.value;
  }

  body.color_primario = document.getElementById('doc-color')?.value || '#1e40af';

  if (logo_base64) body.logo_base64 = logo_base64;
  const hasPreview = document.querySelector('#doc-logo-preview img') !== null;
  const hasLogo = document.querySelector('.mb-3 img') !== null;
  if (!logoFile && !hasPreview && !hasLogo) {
    body.logo_base64 = '';
  }

  try {
    await api('PUT', '/api/config/documentos', body);
    toast('Configuracion de documentos guardada');
    render();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>📄</span> Guardar Docs';
  }
};

// ============ MODALS ============
const modals = {};

window.showModal = function (id, data) {
  modals[id] = { open: true, data: data };
  render();
  requestAnimationFrame(() => {
    const el = document.querySelector('.modal-overlay');
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    // Si es modal de nueva OT, enfocar el primer input
    if (id === 'nueva-ot') {
      setTimeout(() => {
        // Scroll al contenido del modal

window.calcularMontoEstimadoOT = async function () {
  var div = document.getElementById('ot-monto-estimado');
  if (!div) return;
  if (typeof _productosSeleccionados === 'undefined') _productosSeleccionados = [];
  if (_productosSeleccionados.length === 0) {
    div.innerHTML = '<span class="text-gray-400 italic">Selecciona cantidades para calcular</span>';
    return;
  }
  try {
    var d = await api('GET', '/api/config');
    var cfg = d.config || {};
    var total = 0;
    for (var i = 0; i < _productosSeleccionados.length; i++) {
      var p = _productosSeleccionados[i];
      var precio = p.precio || 0;
      total += precio * p.cantidad;
    }
    div.innerHTML = '<span class="font-semibold text-blue-700">RD$ ' + Number(total).toLocaleString('es-DO') + '</span> <span class="text-gray-400 text-xs">(estimado seg\u00fan configuraci\u00f3n)</span>';
  } catch (e) {
    div.innerHTML = '<span class="text-gray-400 italic">No se pudo calcular (configuraci\u00f3n no disponible)</span>';

};

function escHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatFecha(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('es-DO', { year: 'numeric', month: 'short', day: 'numeric' });
}

// ============ RENDER ============
async function render() {
  if (!state.token || !state.user) {
    document.getElementById('app').innerHTML = renderLogin();
    return;
  }

  const layout = renderLayout();
  document.getElementById('app').innerHTML = layout;

  const main = document.getElementById('main-content');
  let content = '';

  try {
    switch (state.view) {
      case 'inicio': content = await renderInicio(); initEncuestasAlertas(); break;
      case 'ordenes': content = await renderOrdenes(); break;
      case 'avales': content = await renderAvales(); break;
      case 'encuestas': content = await renderEncuestas(); break;
      case 'reportes': content = await renderReportes(); break;
      case 'bonos': content = await renderBonos(); break;
      case 'productos': content = await renderProductos(); break;
      case 'perfil': content = renderPerfil(); break;
      case 'usuarios': content = await renderUsuarios(); break;
      case 'config': content = await renderConfig(); break;
      case 'guia': content = renderGuia(); break;
      default: content = await renderInicio();
    }
  } catch (e) {
    if (e.message.includes('401') || e.message.includes('No autorizado')) {
      handleLogout();
      return;
    }
    content = `<div class="card text-center py-12 fade-in"><span class="text-5xl block mb-4">⚠️</span><p class="text-red-500 text-lg mb-2">Error al cargar</p><p class="text-gray-400 text-sm mb-4">${escHtml(e.message)}</p><button onclick="render()" class="btn-primary">Reintentar</button></div>`;
  }

  main.innerHTML = content;

  // Post-render: cargar admin de tipos de servicio si estamos en config
  if (state.view === 'config') {
    renderTiposServicioConfig();
  }

  // Modals after main content
  const modalKeys = Object.keys(modals);
  for (const key of modalKeys) {
    const modal = modals[key];
    if (key === 'nueva-ot') main.innerHTML += renderModalNuevaOT();
    if (key === 'nueva-encuesta') main.innerHTML += renderModalNuevaEncuesta();
    if (key === 'nuevo-usuario') main.innerHTML += renderModalNuevoUsuario();
    if (key === 'editar-usuario') main.innerHTML += renderModalEditarUsuario();
    if (key === 'entrega-aval' && modal.data) main.innerHTML += renderModalEntregaAval(modal.data);
    if (key === 'detalle-aval' && modal.data) main.innerHTML += renderModalDetalleAval(modal.data);
  }
}

window.guardarProducto = async function (e) {
  e.preventDefault();
  const err = document.getElementById('prod-error');
  err.classList.add('hidden');
  const id = document.getElementById('prod-id').value;
  const body = {
    nombre: document.getElementById('prod-nombre').value.trim(),
    categoria: document.getElementById('prod-categoria').value,
    descripcion: document.getElementById('prod-desc').value.trim(),
  };

  try {
    if (id) {
      await api('PUT', '/api/productos/' + id, body);
    } else {
      await api('POST', '/api/productos', body);
    }
    document.getElementById('producto-form-container').innerHTML = '';
    toast('Producto ' + (id ? 'actualizado' : 'creado') + ' correctamente');
    render();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  }
};

window.editarProducto = async function (id) {
  try {
    const d = await api('GET', '/api/productos?todos=1');
    const p = (d.productos || []).find(x => x.id === id);
    if (p) mostrarFormProducto(p);
  } catch (e) { toast('Error: ' + e.message, 'error'); }
};

window.eliminarProducto = async function (id) {
  if (!confirm('¿Desactivar este producto?')) return;
  try {
    await api('DELETE', '/api/productos/' + id);
    toast('Producto desactivado');
    render();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
};

  const form = document.getElementById('form-nueva-ot');

  // Toggle origen OT (radios)
  document.querySelectorAll('[data-toggle-origen]').forEach(el => {
    el.onchange = function() { toggleOrigenOT(); };

  // Presupuesto select

  // Botón Cancelar nuevo presupuesto
  const btnCancelar = document.getElementById('btn-cancelar-nuevo-presupuesto');
  if (btnCancelar) btnCancelar.onclick = function() { cancelarNuevoPresupuesto(); };
  
  // Botón Crear Presupuesto
  const btnCrear = document.getElementById('btn-crear-presupuesto-inline');
  if (btnCrear) btnCrear.onclick = function() { crearPresupuestoInline(); };
}

// Categorias de servicio para el modal de OT
window._otCategoriasCache = {}; // { tipo_nombre: [categorias] }
window._otTiposCache = []; // tipos_servicio completos

window.cargarTiposEnSelect = async function () {
  try {
    const d = await api('GET', '/api/tipos-servicio');
    window._otTiposCache = d.tipos_servicio || [];
    // Build cache
    window._otCategoriasCache = {};
    for (const t of window._otTiposCache) {
      window._otCategoriasCache[t.nombre] = t.categorias || [];
    }
    const sel = document.getElementById('ot-tipo');
    if (!sel) return;
    sel.innerHTML = '<option value="">Seleccionar...</option>'
      + window._otTiposCache.map(function(t) {
        return '<option value="' + t.nombre + '">' + escHtml(t.label) + '</option>';
      }).join('');
    renderCategoriasOT();
  } catch (e) {
    console.error('Error cargando tipos:', e);
  }
};

async function cargarCategoriasOT() {
  try {
    // Cargar productos para mapeo
    var dp = await api('GET', '/api/productos');
    _productos = dp.productos || [];
    await window.cargarTiposEnSelect();
  } catch (e) {
    console.error('Error cargando categorias:', e);
  }
}

function renderCategoriasOT() {
  var container = document.getElementById('ot-categorias-list');
  if (!container) return;
  _productosSeleccionados = [];
  var tipo = document.getElementById('ot-tipo') ? document.getElementById('ot-tipo').value : '';
  var cats = window._otCategoriasCache[tipo] || [];

  container.innerHTML = cats.map(function(c) {
    var precio = Number(c.precio) || 0;
    return '<div class="flex items-center justify-between bg-gray-50 rounded-xl px-4 py-3 border border-gray-200">' +
      '<div class="flex items-center gap-3">' +
        '<span class="text-xl">' + (c.icon || '\ud83d\udce6') + '</span>' +
        '<div>' +
          '<p class="text-sm font-semibold text-gray-700">' + escHtml(c.label) + '</p>' +
          '<p class="text-xs text-gray-400">RD$ ' + precio.toFixed(2) + ' c/u</p>' +
        '</div>' +
      '</div>' +
      '<div class="flex items-center gap-2">' +
        '<input type="number" id="ot-cat-' + c.key + '" class="input-field w-20 text-center" placeholder="0" min="0" value="0" onchange="actualizarCategoriaOT()">' +
      '</div>' +
    '</div>';
  }).join('');
  actualizarCategoriaOT();
}

function actualizarCategoriaOT() {
  _productosSeleccionados = [];
  var tipo = document.getElementById('ot-tipo') ? document.getElementById('ot-tipo').value : '';
  var cats = window._otCategoriasCache[tipo] || [];

  cats.forEach(function(c) {
    var inp = document.getElementById('ot-cat-' + c.key);
    if (inp) {
      var qty = parseInt(inp.value) || 0;
      if (qty > 0) {
        var precio = Number(c.precio) || 0;
        _productosSeleccionados.push({
          producto_id: 0,
          categoria: c.key,
          nombre: c.label,
          cantidad: qty,
          precio: precio
        });
      }
    }
  });
  calcularMontoEstimadoOT();
}

function onCambiarTipoOT() {
  renderCategoriasOT();
}

function actualizarListaProductosOT() {
  const div = document.getElementById('ot-productos-list');

  if (_productosSeleccionados.length === 0) {
    div.innerHTML = '<p class="text-xs text-gray-400 italic">No hay productos agregados</p>';

  ).join('');

window.buscarCliente = async function (q) {
  if (q.length < 2) { document.getElementById('ot-cliente-list')?.classList.add('hidden'); return; }
  const div = document.getElementById('ot-cliente-list');
  if (!div) return;
  try {
    const d = await api('GET', `/api/clientes?search=${encodeURIComponent(q)}`);
    div.innerHTML = (d.clientes || []).map(c =>
      `<a href="#" onclick="seleccionarCliente(${c.id},'${escHtml(c.nombre).replace(/'/g, "\\'")}')" class="block px-4 py-2.5 hover:bg-blue-50 text-sm border-b border-gray-100 last:border-0">${escHtml(c.nombre)} ${c.telefono ? '<span class="text-gray-400">· ' + escHtml(c.telefono) + '</span>' : ''}</a>`
    ).join('');
    div.classList.remove('hidden');
  } catch (e) { /* ignore */ }
};

  document.getElementById('ot-cliente-id').value = id;

window.submitNuevaOT = async function (e) {
  e.preventDefault();
  const err = document.getElementById('ot-error');
  err.classList.add('hidden');

  const origen = document.querySelector('input[name="ot-origen"]:checked')?.value || 'presupuesto';
  let cliente_id, presupuesto_id = null;

  if (origen === 'presupuesto') {
    const psel = document.getElementById('ot-presupuesto');
    presupuesto_id = parseInt(psel.value);
    if (!presupuesto_id) { err.textContent = 'Selecciona un presupuesto'; err.classList.remove('hidden'); return; }
    const p = _presupuestosData.find(x => x.id === presupuesto_id);
    if (!p || !p.cliente_id) { err.textContent = 'Presupuesto sin cliente asignado'; err.classList.remove('hidden'); return; }
    cliente_id = p.cliente_id;
  } else {
    cliente_id = document.getElementById('ot-cliente-id').value;
    if (!cliente_id) { err.textContent = 'Selecciona un cliente'; err.classList.remove('hidden'); return; }
    cliente_id = Number(cliente_id);
  }

  // Validar fecha programada (todos los origenes)
  const fechaVal = document.getElementById('ot-fecha').value;
  if (!fechaVal) {
    err.textContent = 'Selecciona una fecha programada';
    err.classList.remove('hidden');
    return;
  }

  // Validar tecnico asignado (todos los origenes)
  const tecVal = document.getElementById('ot-tecnico').value;
  if (!tecVal) {
    err.textContent = 'Selecciona un técnico asignado';
    err.classList.remove('hidden');
    return;
  }

  // Validar al menos 1 categoria (excepto garantia/levantamiento)
  if (origen !== 'garantia' && origen !== 'levantamiento' && origen !== 'vtc') {
    const tieneCategoria = _productosSeleccionados && _productosSeleccionados.some(function(p) { return p.cantidad > 0; });
    if (!tieneCategoria) {
      err.textContent = 'Selecciona al menos 1 servicio por categoría';
      err.classList.remove('hidden');
      return;
    }
  }

  // Read categorias (productos) from _productosSeleccionados
  var productos = [];
  if (origen === 'garantia' || origen === 'levantamiento' || origen === 'vtc') {
    // Garantia/levantamiento: usar tipo_servicio como categoria, monto 0
    productos.push({ categoria: document.getElementById('ot-tipo').value, nombre: document.getElementById('ot-tipo').value, cantidad: 1 });
  } else if (typeof _productosSeleccionados !== 'undefined') {
    for (var i = 0; i < _productosSeleccionados.length; i++) {
      var p = _productosSeleccionados[i];
      if (p.cantidad > 0) {
        productos.push({ categoria: p.categoria, nombre: p.nombre, cantidad: p.cantidad });
      }
    }
  }

  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Creando...';

  try {
    const body = {
      cliente_id: cliente_id,
      presupuesto_id: presupuesto_id,
      tipo_servicio: document.getElementById('ot-tipo').value,
      descripcion: document.getElementById('ot-desc').value,
      monto_total: (function() { var t=0; if(typeof _productosSeleccionados!=='undefined') for(var i=0;i<_productosSeleccionados.length;i++){var p=_productosSeleccionados[i];t+=(p.precio||0)*p.cantidad} return t; })(),
      tecnico_id: Number(document.getElementById('ot-tecnico').value) || null,
      fecha_programada: document.getElementById('ot-fecha').value || null,
      presupuesto_aprobado: 1,
      estado: 'pendiente',
      fuente: origen,
      productos: productos,
    };

    const result = await api('POST', '/api/ordenes', body);

    // Upload PDF if selected
    const pdfInput = document.getElementById('ot-presupuesto-pdf');
    if (pdfInput && pdfInput.files.length > 0 && presupuesto_id) {
      const formData = new FormData();
      formData.append('presupuesto_id', presupuesto_id);
      formData.append('archivo', pdfInput.files[0]);
      try {
        await fetch('/api/presupuestos/upload', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + state.token },
          body: formData,
        });
      } catch (pdfErr) {
        console.warn('Error subiendo PDF (no critico):', pdfErr.message);
      }
    }

    closeModal('nueva-ot');
    toast('OT creada: ' + (result.numero_ot || 'OK'));
  } catch (e) {
    console.error('submitNuevaOT error:', e);
    err.textContent = e.message || 'Error desconocido al crear OT';
    err.classList.remove('hidden');
    btn.disabled = false; btn.innerHTML = 'Crear OT';
  }
};

const _encValues = {};

window.setEncuestaVal = function (key, val) {
  _encValues[key] = val;
  for (let v = 1; v <= 5; v++) {
    const el = document.getElementById(`enc-${key}-${v}`);
    if (el) {
      el.className = `w-10 h-10 rounded-full text-sm font-semibold transition-all ${v <= val ? 'bg-yellow-400 text-yellow-900 shadow-sm' : 'bg-gray-200 text-gray-500 hover:bg-yellow-300 hover:text-yellow-800'}`;
    }
  }

  // Calculate
  const pesos = { tiempo_entrega: 1.5, desempeno_equipo: 1.5, conocimientos_tecnicos: 1.5, presentacion_equipo: 1.0, calidad_productos: 1.0, calidad_entrenamientos: 1.0 };
  const keys = ['satisfaccion_general', 'tiempo_entrega', 'desempeno_equipo', 'presentacion_equipo', 'calidad_productos', 'conocimientos_tecnicos', 'calidad_entrenamientos'];
  let sumP = 0, sumW = 0;
  for (const k of keys) {
    const v = _encValues[k] || 3;
    const w = k === 'satisfaccion_general' ? 1.0 : (pesos[k] || 1.0);
    sumP += v * w;
    sumW += w;
  }
  const pct = Math.round((sumP / sumW / 5) * 100);
  document.getElementById('enc-pct').textContent = pct + '%';
  document.getElementById('enc-pct-bar').style.width = pct + '%';
};

window.submitNuevaEncuesta = async function (e) {
  e.preventDefault();
  const err = document.getElementById('enc-error');
  err.classList.add('hidden');

  const otId = document.getElementById('enc-ot').value;
  if (!otId) { err.textContent = 'Selecciona una OT'; err.classList.remove('hidden'); return; }

  const keys = ['satisfaccion_general', 'tiempo_entrega', 'desempeno_equipo', 'presentacion_equipo', 'calidad_productos', 'conocimientos_tecnicos', 'calidad_entrenamientos'];
  const body = { orden_trabajo_id: Number(otId), recomendaria: 1 };
  for (const k of keys) body[k] = _encValues[k] || 3;
  body.observaciones = document.getElementById('enc-obs').value;

  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Guardando...';

  try {
    await api('POST', '/api/encuestas', body);
    closeModal('nueva-encuesta');
    toast('Encuesta registrada correctamente');
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Guardar Encuesta';
  }
};

window.submitCambiarPassword = async function (e) {
  e.preventDefault();
  const err = document.getElementById('pw-error');
  const success = document.getElementById('pw-success');
  err.classList.add('hidden');
  success.classList.add('hidden');

  const currentPassword = document.getElementById('pw-current').value;
  const newPassword = document.getElementById('pw-new').value;
  const confirmPassword = document.getElementById('pw-confirm').value;

  if (newPassword !== confirmPassword) {
    err.textContent = 'Las contraseñas nuevas no coinciden';
    err.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('pw-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner align-middle mr-2"></span> Actualizando...';

  try {
    await api('PUT', '/api/auth/password', { currentPassword, newPassword });
    success.textContent = 'Contraseña actualizada correctamente';
    success.classList.remove('hidden');
    document.getElementById('pw-current').value = '';
    document.getElementById('pw-new').value = '';
    document.getElementById('pw-confirm').value = '';
    toast('Contraseña actualizada');
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Actualizar Contraseña';
  }
};

// Preload OT completadas for encuestas modal on startup
let _otsCompletadas = [];

(async function init() {
  if (state.token && state.user) {
    state.view = 'inicio';
    try {
      // Verificar que el token sigue siendo válido
      const authCheck = await api('GET', '/api/auth');
      if (!authCheck.user) throw new Error('Token inválido');
      
            // Cargar config de documentos para el color del sidebar
      try {
        const docResp = await api('GET', '/api/config/documentos');
        if (docResp.configuracion?.color_primario) {
          aplicarColorSidebar(docResp.configuracion.color_primario);
        }
      } catch(e) { /* ignore */ }
      const d = await api('GET', '/api/ordenes?estado=completada');
      _otsCompletadas = d.ordenes || [];
      // Cargar alertas de encuestas
      initEncuestasAlertas();
    } catch (e) {
      console.warn('[init] Token inválido o servidor no disponible, redirigiendo a login:', e.message);
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      state.token = null;
      state.user = null;
      state.view = 'login';
    }
    // Preload tecnicos
    loadTecnicos();
  }
  render();
})();

const origRender = render;
function aplicarColorSidebar(color) {
  const c = color || '#1e40af';
  document.documentElement.style.setProperty('--sidebar-bg', c);
  document.querySelector('.hamburger')?.style.setProperty('background', c, 'important');
  document.querySelectorAll('.sidebar-header').forEach(el => {
    el.style.background = 'linear-gradient(135deg, ' + c + ' 0%, ' + lighterColor(c, 30) + ' 100%)';
  });
}
function lighterColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, (num >> 16) + Math.round(255 * percent / 100));
  const g = Math.min(255, ((num >> 8) & 0x00FF) + Math.round(255 * percent / 100));
  const b = Math.min(255, (num & 0x0000FF) + Math.round(255 * percent / 100));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
render = async function () {
  await origRender();

        _otsCompletadas.map(o => `<option value="${o.id}">${o.numero_ot} — ${escHtml(o.cliente_nombre)}</option>`).join('');
    }
  }
};
